async function syncToSb(salonId, staff, services, availability) {
  if (!salonId) return {
    ok: false
  };
  const idMap = {};
  // Try dedicated tables (non-fatal if RLS policies are missing)
  try {
    await Promise.all([sb.from('staff').delete().eq('salon_id', salonId), sb.from('services').delete().eq('salon_id', salonId), sb.from('availability').delete().eq('salon_id', salonId)]);
    if (staff.length > 0) {
      const {
        data: insertedStaff
      } = await sb.from('staff').insert(staff.map(m => ({
        salon_id: salonId,
        name: m.name,
        color: m.color || '#4FD1C5',
        active: m.active !== false,
        sick: m.sick || false
      }))).select();
      if (insertedStaff) {
        staff.forEach(m => {
          const match = insertedStaff.find(r => r.name === m.name);
          if (match) idMap[m.id] = match.id;
        });
      }
    }
    const svcIdMap = {};
    if (services.length > 0) {
      const {
        data: insertedSvcs
      } = await sb.from('services').insert(services.map(sv => ({
        salon_id: salonId,
        name: sv.name,
        duration: sv.duration || 30,
        price: sv.price || 0,
        buffer: sv.buffer || 0
      }))).select();
      if (insertedSvcs) {
        services.forEach(sv => {
          const match = insertedSvcs.find(r => r.name === sv.name);
          if (match) svcIdMap[sv.id] = match.id;
        });
      }
    }
    const availRows = [];
    Object.entries(availability || {}).forEach(([sid, a]) => {
      const sbStaffId = idMap[sid] || sid;
      (a.days || []).forEach(dow => availRows.push({
        salon_id: salonId,
        staff_id: sbStaffId,
        day_of_week: dow,
        start_time: a.start,
        end_time: a.end
      }));
    });
    if (availRows.length > 0) {
      await sb.from('availability').insert(availRows);
    }
  } catch (e) {
    console.warn('Table sync (non-fatal):', e?.message);
  }
  // Always store JSON in salon record — primary source for anonymous reads
  try {
    const finalStaffJson = staff.map(m => ({
      id: idMap[m.id] || m.id,
      name: m.name,
      color: m.color || '#4FD1C5',
      active: m.active !== false,
      sick: m.sick || false
    }));
    const svcsForJson = services.map(sv => ({
      id: svcIdMap[sv.id] || sv.id,
      name: sv.name,
      duration: sv.duration || 30,
      price: sv.price || 0,
      buffer: sv.buffer || 0
    }));
    const availJson = {};
    Object.entries(availability || {}).forEach(([sid, a]) => {
      const mappedId = idMap[sid] || sid;
      availJson[mappedId] = {
        start: a.start,
        end: a.end,
        days: a.days || []
      };
    });
    const {
      error: upErr
    } = await sb.from('salons').update({
      services_json: JSON.stringify(svcsForJson),
      staff_json: JSON.stringify(finalStaffJson),
      avail_json: JSON.stringify(availJson)
    }).eq('id', salonId);
    if (upErr) console.error('Salon JSON update error:', upErr.message);
    return {
      ok: !upErr,
      idMap,
      svcIdMap
    };
  } catch (e) {
    console.error('Salon JSON update failed:', e);
    return {
      ok: false,
      idMap
    };
  }
